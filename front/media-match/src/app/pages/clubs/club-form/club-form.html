<div class="club-form-container">
  <mat-card class="form-card">
    <mat-card-header>
      <h1>{{ isEditMode ? 'Editar Clube' : 'Criar Novo Clube' }}</h1>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="clubForm" (ngSubmit)="onSubmit()">
        
        <!-- Image Preview/Upload -->
        <div class="image-section">
          <div class="image-preview" *ngIf="imagePreview || existingImageUrl">
            <img [src]="imagePreview || getImageUrl(existingImageUrl)" alt="Preview">
            <button 
              type="button" 
              mat-icon-button 
              class="remove-image-btn" 
              (click)="removeImage()">
              <mat-icon>close</mat-icon>
            </button>
          </div>
          
          <div class="image-placeholder" *ngIf="!imagePreview && !existingImageUrl">
            <mat-icon>image</mat-icon>
            <p>Nenhuma imagem selecionada</p>
          </div>

          <input 
            type="file" 
            accept="image/*" 
            (change)="onFileSelected($event)" 
            #fileInput 
            style="display: none">
          <button 
            type="button" 
            mat-raised-button 
            (click)="fileInput.click()">
            <mat-icon>upload</mat-icon> Escolher Imagem
          </button>
        </div>

        <!-- Club Name -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Nome do Clube</mat-label>
          <input 
            matInput 
            formControlName="name" 
            placeholder="Ex: Fãs de Ficção Científica"
            maxlength="100">
          <mat-hint align="end">{{ clubForm.get('name')?.value?.length || 0 }}/100</mat-hint>
          <mat-error *ngIf="clubForm.get('name')?.hasError('required')">
            Nome é obrigatório
          </mat-error>
          <mat-error *ngIf="clubForm.get('name')?.hasError('minlength')">
            Nome deve ter pelo menos 3 caracteres
          </mat-error>
        </mat-form-field>

        <!-- Description -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Descrição</mat-label>
          <textarea 
            matInput 
            formControlName="description" 
            rows="4"
            maxlength="500"
            placeholder="Descreva o propósito do clube..."></textarea>
          <mat-hint align="end">{{ clubForm.get('description')?.value?.length || 0 }}/500</mat-hint>
        </mat-form-field>

        <!-- Form Actions -->
        <div class="form-actions">
          <button 
            type="button" 
            mat-button 
            routerLink="/clubs"
            [disabled]="loading">
            Cancelar
          </button>
          <button 
            type="submit" 
            mat-raised-button 
            color="primary"
            [disabled]="clubForm.invalid || loading">
            <mat-spinner *ngIf="loading" diameter="20"></mat-spinner>
            <span *ngIf="!loading">{{ isEditMode ? 'Salvar' : 'Criar Clube' }}</span>
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
