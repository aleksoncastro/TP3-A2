<div class="container list-container">
  <h1 class="page-title">{{ pageTitle }}</h1>

  <div class="movie-grid" *ngIf="series$ | async as series; else loading">
    
    <div class="movie-item" *ngFor="let show of series">
      <a [routerLink]="['/serie', show.id]" class="media-card">
        <div class="poster-wrapper">
          <img 
            [src]="getImageUrl(show.poster_path)" 
            [alt]="show.name" 
            class="media-poster" 
            loading="lazy"
            (error)="onImgError($event)"
          >
          <div class="media-overlay">
            <h3 class="media-title">{{ show.name }}</h3>
            <div class="media-rating">
              <mat-icon class="rating-icon">star</mat-icon>
              <span>{{ formatRating(show.vote_average) }}</span>
            </div>
          </div>
        </div>
      </a>
    </div>

    <div *ngIf="series.length === 0" class="no-results">
      <p>Nenhuma série encontrada.</p>
    </div>

    <div class="end-of-list">
      <button class="load-more-btn" (click)="loadMore()" [disabled]="loadingMore || !canLoadMore" aria-label="Mostrar mais resultados">
        <span>Mostrar mais</span>
        <mat-spinner *ngIf="loadingMore" diameter="18" class="btn-spinner" color="accent"></mat-spinner>
      </button>
    </div>

  </div>

  <ng-template #loading>
    <div class="loading-state">
      <mat-spinner diameter="40" color="accent"></mat-spinner>
    </div>
  </ng-template>
</div>
