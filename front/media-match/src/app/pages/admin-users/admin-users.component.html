<div class="container">
  <h2>Usuários</h2>
  <div class="filters">
    <mat-form-field>
      <input matInput placeholder="Nome" [(ngModel)]="name" />
    </mat-form-field>
    <mat-form-field>
      <input matInput placeholder="Email" [(ngModel)]="email" />
    </mat-form-field>
    <mat-form-field>
      <mat-select placeholder="Role" [(ngModel)]="role">
        <mat-option value="">Todas</mat-option>
        <mat-option value="user">user</mat-option>
        <mat-option value="admin">admin</mat-option>
      </mat-select>
    </mat-form-field>
    <button mat-raised-button color="primary" (click)="load()">Filtrar</button>
  </div>

  <table mat-table [dataSource]="items()" class="mat-elevation-z2">
    <ng-container matColumnDef="userName">
      <th mat-header-cell *matHeaderCellDef>Nome</th>
      <td mat-cell *matCellDef="let row">{{ row.userName }}</td>
    </ng-container>
    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let row">{{ row.email }}</td>
    </ng-container>
    <ng-container matColumnDef="createdAt">
      <th mat-header-cell *matHeaderCellDef>Cadastro</th>
      <td mat-cell *matCellDef="let row">{{ row.createdAt | date:'short' }}</td>
    </ng-container>
    <ng-container matColumnDef="role">
      <th mat-header-cell *matHeaderCellDef>Role</th>
      <td mat-cell *matCellDef="let row">
        <mat-select [(ngModel)]="row.role" (selectionChange)="onRoleChange(row)">
          <mat-option value="user">user</mat-option>
          <mat-option value="admin">admin</mat-option>
        </mat-select>
      </td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Ações</th>
      <td mat-cell *matCellDef="let row">
        <button mat-stroked-button color="primary" (click)="promote(row)" [disabled]="row.role==='admin'">Promover</button>
        <button mat-stroked-button color="warn" (click)="demote(row)" [disabled]="row.role==='user'">Rebaixar</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <mat-paginator [length]="total()" [pageSize]="pageSize" (page)="onPage($event)"></mat-paginator>
</div>
