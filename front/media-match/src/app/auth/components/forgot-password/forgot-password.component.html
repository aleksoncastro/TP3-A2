<div class="recover-shell">
  <mat-card class="recover-card" role="form" aria-label="Formulário de recuperação de senha">
    <a routerLink="/" class="brand-logo" aria-label="Voltar para a página inicial">MediaMatch</a>

    <div class="card-header">
      <div class="icon-badge" aria-hidden="true">
        <mat-icon>lock_reset</mat-icon>
      </div>
      <div>
        <h1>Recuperar acesso</h1>
        <p>Informe o email cadastrado para receber o código de redefinição.</p>
      </div>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-stack">
      <div class="app-input-wrapper" [class.invalid]="form.controls.email.invalid && form.controls.email.touched">
        <label class="app-input-label" for="email">Email cadastrado</label>
        <div class="app-input-inner">
          <mat-icon class="app-input-icon" aria-hidden="true">mail</mat-icon>
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="voce@exemplo.com"
            autocomplete="email"
            aria-required="true"
          />
        </div>
        <div class="app-input-error" *ngIf="form.controls.email.touched && form.controls.email.invalid">
          <span *ngIf="form.controls.email.hasError('required')">Email é obrigatório.</span>
          <span *ngIf="form.controls.email.hasError('email')">Informe um email válido.</span>
        </div>
      </div>

      <button mat-raised-button color="primary" type="submit" class="submit-btn" [disabled]="form.invalid || loading">
        <mat-progress-spinner
          *ngIf="loading"
          class="button-spinner"
          color="accent"
          mode="indeterminate"
          diameter="18"
        ></mat-progress-spinner>
        <mat-icon *ngIf="!loading" aria-hidden="true">send</mat-icon>
        <span>{{ loading ? 'Enviando código...' : 'Enviar código' }}</span>
      </button>
    </form>

    <div class="card-footer">
      <button mat-button type="button" (click)="gotoLogin()">
        <mat-icon>arrow_back</mat-icon>
        Voltar para o login
      </button>
    </div>
  </mat-card>
</div>
